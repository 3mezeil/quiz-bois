<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz : Identifier les essences de bois</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: pan-y;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #2b1d0c 0%, #1a1208 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            color: #333;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 800px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Animations */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            50% {
                transform: translateX(6px);
            }

            75% {
                transform: translateX(-6px);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        .pulse {
            animation: pulse 0.3s ease-in-out;
        }

        .badge-container {
            height: 28px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .badge {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #8d5b28;
            background: #fdf3e7;
            padding: 6px 14px;
            border-radius: 50px;
        }

        h1 {
            font-size: 1.35rem;
            height: 28px;
            margin-bottom: 12px;
            color: #271a0c;
            flex-shrink: 0;
        }

        .image-wrapper {
            width: 100%;
            flex: 1 1 120px;
            max-height: 280px;
            min-height: 120px;
            border-radius: 14px;
            overflow: hidden;
            background-color: #eee;
            margin-bottom: 16px;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s;
        }

        .image-wrapper:hover img {
            transform: scale(1.03);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .modal img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 8px;
            object-fit: contain;
        }

        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
            height: 20px;
            flex-shrink: 0;
        }

        input[type="text"] {
            width: 100%;
            height: 52px;
            padding: 14px 16px;
            font-size: 1.05rem;
            border: 2px solid #ddd;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        input[type="text"]:focus {
            border-color: #8d5b28;
        }

        input[type="text"]:disabled {
            background-color: #f8f9fa;
            color: #271a0c;
            font-weight: bold;
            border-color: #e9ecef;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        button {
            flex: 1;
            height: 52px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-validate {
            background-color: #8d5b28;
            color: #fff;
        }

        .btn-giveup {
            background-color: #f8f9fa;
            color: #6c757d;
            border: 2px solid #dee2e6;
        }

        .btn-next {
            background-color: #28a745;
            color: #fff;
        }

        .btn-restart {
            flex: none;
            background-color: #271a0c;
            color: #fff;
            padding: 0 40px;
            font-size: 1.1rem;
            margin-top: 30px;
            width: auto;
            min-width: 250px;
        }

        .feedback {
            height: 28px;
            line-height: 28px;
            margin-top: 10px;
            font-weight: 600;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .feedback.success {
            color: #28a745;
        }

        .feedback.error {
            color: #dc3545;
        }

        .feedback.info {
            color: #0056b3;
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 16px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .page-num {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f3f5;
            color: #adb5bd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: not-allowed;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .page-num.reachable {
            background: #e9ecef;
            color: #495057;
            cursor: pointer;
        }

        .page-num.reachable:hover {
            background: #dee2e6;
        }

        .page-num.active {
            background: #8d5b28;
            color: #fff;
            cursor: default;
            transform: scale(1.1);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
            flex-shrink: 0;
            margin-top: auto;
        }

        .progress-bar {
            height: 100%;
            background: #8d5b28;
            width: 0%;
            transition: width 0.4s ease;
        }

        .finished-title {
            font-size: 1.6rem;
            color: #28a745;
            margin: 16px 0 10px 0;
        }

        .end-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-grow: 1;
        }
    </style>
</head>

<body>

    <div id="image-modal" class="modal">
        <img id="modal-img" src="" alt="Image plein écran">
    </div>

    <div class="card" id="quiz-card">
        <div class="badge-container">
            <span class="badge" id="progress-badge">Bois 1 sur 20</span>
        </div>
        <h1>Identifier l'essence</h1>

        <div class="image-wrapper" onclick="openModal()">
            <img id="wood-img" src="" alt="Échantillon de bois">
        </div>

        <label for="answer-input">Quel est le nom de cette essence ?</label>
        <input type="text" id="answer-input" autocomplete="off" autocorrect="off" spellcheck="false">

        <div class="btn-row">
            <button id="giveup-btn" class="btn-giveup" onclick="giveUp()">Abandonner</button>
            <button id="action-btn" class="btn-validate" onclick="handleAction()">Valider</button>
        </div>

        <div class="feedback" id="feedback-msg"></div>

        <div class="pagination" id="pagination"></div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <script>
        const originalWoods = [
            { file: "padouk.jpg", name: "Padouk", answers: ["padouk", "padouk afrique"] },
            { file: "bubinga.jpg", name: "Bubinga", answers: ["bubinga"] },
            { file: "amarante.jpg", name: "Amarante", answers: ["amarante"] },
            { file: "frene.jpg", name: "Frêne", answers: ["frene"] },
            { file: "peuplier.jpg", name: "Peuplier", answers: ["peuplier"] },
            { file: "teck.jpg", name: "Teck", answers: ["teck"] },
            { file: "acajou.jpg", name: "Acajou", answers: ["acajou"] },
            { file: "erable.jpg", name: "Érable", answers: ["erable"] },
            { file: "chene-rouge-dosse.jpg", name: "Chêne rouge (dosse)", answers: ["chene rouge dosse", "chene rouge", "chene"] },
            { file: "sapin-douglas.jpg", name: "Sapin Douglas", answers: ["sapin douglas", "douglas", "sapin"] },
            { file: "hetre.jpg", name: "Hêtre", answers: ["hetre"] },
            { file: "merisier.jpg", name: "Merisier", answers: ["merisier"] },
            { file: "cerisier.jpg", name: "Cerisier", answers: ["cerisier"] },
            { file: "cedre.jpg", name: "Cèdre odoriférant", answers: ["cedre odoriferant", "cedre"] },
            { file: "caryer.jpg", name: "Caryer (Hickory)", answers: ["caryer", "hickory", "caryer hickory"] },
            { file: "tilleul.jpg", name: "Tilleul", answers: ["tilleul"] },
            { file: "noyer-noir.jpg", name: "Noyer noir", answers: ["noyer noir"] },
            { file: "noyer-cendre.jpg", name: "Noyer cendré", answers: ["noyer cendre"] },
            { file: "chene-rouge-quartier.jpg", name: "Chêne rouge (quartier)", answers: ["chene rouge quartier", "chene sur quartier", "chene rouge", "chene"] },
            { file: "pin-blanc.jpg", name: "Pin blanc", answers: ["pin blanc", "pin"] }
        ];

        let woods = [];
        let currentIndex = 0;
        let highestIndexReached = 0;
        let currentState = 'answering';

        const modal = document.getElementById("image-modal");

        function openModal() {
            document.getElementById("modal-img").src = document.getElementById("wood-img").src;
            modal.style.display = "flex";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        modal.addEventListener('click', closeModal);

        let touchStartX = 0;
        let touchStartY = 0;

        modal.addEventListener('touchstart', function (e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        modal.addEventListener('touchend', function (e) {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;

            if (Math.abs(touchEndX - touchStartX) > 40 || Math.abs(touchEndY - touchStartY) > 40) {
                closeModal();
            }
        }, { passive: true });

        document.getElementById("answer-input").addEventListener("focus", function () {
            setTimeout(() => {
                document.getElementById("quiz-card").scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }, 300);
        });

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function stripAccents(str) {
            return str
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
        }

        function triggerAnimation(type) {
            const card = document.getElementById("quiz-card");
            card.classList.remove("shake", "pulse");
            void card.offsetWidth;
            card.classList.add(type);
        }

        function initQuiz() {
            woods = shuffleArray(originalWoods).map(wood => ({
                ...wood,
                status: 'unanswered'
            }));
            currentIndex = 0;
            highestIndexReached = 0;
            displayQuestion();
        }

        function renderPagination() {
            const container = document.getElementById("pagination");
            container.innerHTML = "";

            for (let i = 0; i < woods.length; i++) {
                const btn = document.createElement("div");
                btn.className = "page-num";
                btn.textContent = i + 1;

                if (i === currentIndex) {
                    btn.classList.add("active");
                } else if (i <= highestIndexReached) {
                    btn.classList.add("reachable");
                    btn.onclick = () => jumpToQuestion(i);
                }

                container.appendChild(btn);
            }
        }

        function jumpToQuestion(index) {
            currentIndex = index;
            displayQuestion();
        }

        function displayQuestion() {
            if (currentIndex > highestIndexReached) {
                highestIndexReached = currentIndex;
            }

            renderPagination();

            const item = woods[currentIndex];
            document.getElementById("wood-img").src = item.file;
            document.getElementById("progress-badge").textContent = `Bois ${currentIndex + 1} sur ${woods.length}`;

            const input = document.getElementById("answer-input");
            const actionBtn = document.getElementById("action-btn");
            const giveupBtn = document.getElementById("giveup-btn");
            const feedback = document.getElementById("feedback-msg");

            if (item.status === 'unanswered') {
                input.value = "";
                input.disabled = false;

                feedback.textContent = "";
                feedback.className = "feedback";

                actionBtn.textContent = "Valider";
                actionBtn.className = "btn-validate";
                giveupBtn.style.display = "block";

                currentState = 'answering';

                // Focus automatique lors de l'arrivée sur une nouvelle question
                setTimeout(() => {
                    input.focus();
                }, 50);

            } else {
                input.value = item.name;
                input.disabled = true;
                giveupBtn.style.display = "none";
                actionBtn.textContent = "Suivant ➔";
                actionBtn.className = "btn-next";
                currentState = 'next';

                feedback.textContent = `Bois déjà identifié : ${item.name}`;
                feedback.className = "feedback info";
            }

            const progressPercent = (highestIndexReached / (woods.length - 1)) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;
        }

        function handleAction() {
            if (currentState === 'answering') {
                submitAnswer();
            } else if (currentState === 'next') {
                goToNext();
            }
        }

        function submitAnswer() {
            const item = woods[currentIndex];
            const input = document.getElementById("answer-input");
            const val = stripAccents(input.value);
            const validList = item.answers.map(stripAccents);
            const feedback = document.getElementById("feedback-msg");
            const actionBtn = document.getElementById("action-btn");
            const giveupBtn = document.getElementById("giveup-btn");

            if (!val) return;

            if (validList.includes(val)) {
                triggerAnimation("pulse");
                item.status = 'answered';

                input.value = item.name;
                input.disabled = true;
                input.blur();

                feedback.textContent = `Bonne réponse : ${item.name}`;
                feedback.className = "feedback success";

                giveupBtn.style.display = "none";
                actionBtn.textContent = "Suivant ➔";
                actionBtn.className = "btn-next";
                currentState = 'next';

                // On redonne le focus à la fenêtre générale pour que 'Enter' soit capté facilement
                window.focus();
            } else {
                triggerAnimation("shake");
                feedback.textContent = "Mauvaise réponse, essaie encore.";
                feedback.className = "feedback error";
                input.focus();
            }
        }

        function giveUp() {
            const item = woods[currentIndex];
            const input = document.getElementById("answer-input");
            const feedback = document.getElementById("feedback-msg");
            const actionBtn = document.getElementById("action-btn");
            const giveupBtn = document.getElementById("giveup-btn");

            item.status = 'answered';

            input.value = item.name;
            input.disabled = true;
            input.blur();

            feedback.textContent = `La réponse était : ${item.name}`;
            feedback.className = "feedback info";

            giveupBtn.style.display = "none";
            actionBtn.textContent = "Suivant ➔";
            actionBtn.className = "btn-next";
            currentState = 'next';

            window.focus();
        }

        function goToNext() {
            currentIndex++;
            if (currentIndex < woods.length) {
                displayQuestion();
            } else {
                document.getElementById("progress-bar").style.width = "100%";
                document.getElementById("quiz-card").innerHTML = `
        <div class="end-screen">
          <div class="badge">Terminé</div>
          <h2 class="finished-title">Félicitations</h2>
          <p style="color: #666; margin: 12px 0 24px;">Tu as parcouru les ${woods.length} essences de bois.</p>
          <button class="btn-restart" onclick="location.reload()">Recommencer le quiz</button>
        </div>
      `;
            }
        }

        // Écouteur global sur le document entier pour la touche Entrée
        document.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                e.preventDefault(); // Évite tout comportement par défaut indésirable

                // Si on est en train de répondre, on ferme le clavier virtuel (mobile) avant de valider
                if (currentState === 'answering' && document.activeElement === document.getElementById("answer-input")) {
                    document.getElementById("answer-input").blur();
                }

                handleAction();
            }
        });

        window.onload = initQuiz;
    </script>

</body>

</html>
