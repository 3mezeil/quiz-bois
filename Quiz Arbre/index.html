<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz : Identifier les essences de bois</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #2b1d0c 0%, #1a1208 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #333;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .badge {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #8d5b28;
            background: #fdf3e7;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.35rem;
            margin-bottom: 16px;
            color: #271a0c;
        }

        .image-wrapper {
            width: 100%;
            height: 320px;
            border-radius: 14px;
            overflow: hidden;
            background-color: #eee;
            margin-bottom: 18px;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.05rem;
            border: 2px solid #ddd;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
            margin-bottom: 12px;
        }

        input[type="text"]:focus {
            border-color: #8d5b28;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-validate {
            background-color: #8d5b28;
            color: #fff;
        }

        .btn-next {
            background-color: #28a745;
            color: #fff;
        }

        .feedback {
            min-height: 28px;
            margin-top: 14px;
            font-weight: 600;
            font-size: 1rem;
        }

        .feedback.success {
            color: #28a745;
        }

        .feedback.error {
            color: #dc3545;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            margin-top: 18px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #8d5b28;
            width: 0%;
            transition: width 0.3s ease;
        }

        .finished-title {
            font-size: 1.6rem;
            color: #28a745;
            margin: 16px 0 10px 0;
        }
    </style>
</head>

<body>

    <div class="card" id="quiz-card">
        <span class="badge" id="progress-badge">Bois 1 sur 20</span>
        <h1>Identifier l'essence</h1>

        <div class="image-wrapper">
            <img id="wood-img" src="" alt="Échantillon de bois">
        </div>

        <label for="answer-input">Quel est le nom de cette essence ?</label>
        <input type="text" id="answer-input" placeholder="Ex: Érable, Padouk..." autocomplete="off" autocorrect="off"
            spellcheck="false">

        <div class="btn-row">
            <button class="btn-validate" id="btn-validate" onclick="submitAnswer()">Valider</button>
            <button class="btn-next" id="btn-next" style="display: none;" onclick="goToNext()">Suivant ➔</button>
        </div>

        <div class="feedback" id="feedback-msg"></div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <script>
        // Liste complète de tes 20 questions
        const woods = [
            { file: "padouk.jpg", answers: ["padouk", "padouk afrique"] },
            { file: "bubinga.jpg", answers: ["bubinga"] },
            { file: "amarante.jpg", answers: ["amarante"] },
            { file: "frene.jpg", answers: ["frene"] },
            { file: "peuplier.jpg", answers: ["peuplier"] },
            { file: "teck.jpg", answers: ["teck"] },
            { file: "acajou.jpg", answers: ["acajou"] },
            { file: "erable.jpg", answers: ["erable"] },
            { file: "chene-rouge-dosse.jpg", answers: ["chene rouge dosse", "chene rouge", "chene"] },
            { file: "sapin-douglas.jpg", answers: ["sapin douglas", "douglas", "sapin"] },
            { file: "hetre.jpg", answers: ["hetre"] },
            { file: "merisier.jpg", answers: ["merisier"] },
            { file: "cerisier.jpg", answers: ["cerisier"] },
            { file: "cedre.jpg", answers: ["cedre odoriferant", "cedre"] },
            { file: "caryer.jpg", answers: ["caryer", "hickory", "caryer hickory"] },
            { file: "tilleul.jpg", answers: ["tilleul"] },
            { file: "noyer-noir.jpg", answers: ["noyer noir"] },
            { file: "noyer-cendre.jpg", answers: ["noyer cendre"] },
            { file: "chene-rouge-quartier.jpg", answers: ["chene rouge quartier", "chene sur quartier", "chene rouge", "chene"] },
            { file: "pin-blanc.jpg", answers: ["pin blanc", "pin"] }
        ];

        let currentIndex = 0;

        // Fonction pour enlever les accents et mettre en minuscules
        function stripAccents(str) {
            return str
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
        }

        function displayQuestion() {
            const item = woods[currentIndex];
            document.getElementById("wood-img").src = item.file;
            document.getElementById("answer-input").value = "";
            document.getElementById("answer-input").disabled = false;
            document.getElementById("feedback-msg").textContent = "";
            document.getElementById("feedback-msg").className = "feedback";
            document.getElementById("btn-validate").style.display = "block";
            document.getElementById("btn-next").style.display = "none";
            document.getElementById("progress-badge").textContent = `Bois ${currentIndex + 1} sur ${woods.length}`;

            const progressPercent = (currentIndex / woods.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;

            document.getElementById("answer-input").focus();
        }

        function submitAnswer() {
            const input = document.getElementById("answer-input");
            const val = stripAccents(input.value);
            const validList = woods[currentIndex].answers.map(stripAccents);
            const feedback = document.getElementById("feedback-msg");

            if (!val) return;

            if (validList.includes(val)) {
                feedback.textContent = "Bonne réponse ! 🎉";
                feedback.className = "feedback success";
                input.disabled = true;
                document.getElementById("btn-validate").style.display = "none";
                document.getElementById("btn-next").style.display = "block";
            } else {
                feedback.textContent = "Mauvaise réponse, essaie encore !";
                feedback.className = "feedback error";
            }
        }

        function goToNext() {
            currentIndex++;
            if (currentIndex < woods.length) {
                displayQuestion();
            } else {
                document.getElementById("progress-bar").style.width = "100%";
                document.getElementById("quiz-card").innerHTML = `
        <div class="badge">Terminé !</div>
        <h2 class="finished-title">Félicitations ! 🎉</h2>
        <p style="color: #666; margin: 12px 0 24px;">Tu as reconnu avec succès les ${woods.length} essences de bois !</p>
        <button class="btn-validate" onclick="location.reload()">Recommencer le quiz</button>
      `;
            }
        }

        document.getElementById("answer-input").addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                if (document.getElementById("btn-next").style.display === "block") {
                    goToNext();
                } else {
                    submitAnswer();
                }
            }
        });

        window.onload = displayQuestion;
    </script>

</body>

</html>
